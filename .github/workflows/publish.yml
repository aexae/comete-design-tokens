name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        run: pnpm publish --no-git-checks
        env:
          NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # R6 : les fichiers générés sont attachés à la Release du tag, à une URL stable
      # indépendante de l'arborescence du dépôt :
      #   https://github.com/aexae/comete-design-tokens/releases/download/vX.Y.Z/comete-tokens.light.omnis.json
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/css/comete-tokens.css
            build/omnis/comete-tokens.light.omnis.json
            build/omnis/comete-tokens.dark.omnis.json
          generate_release_notes: true
